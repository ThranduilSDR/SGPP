<!-- Barra superior corporativa (Toolbar) -->
<po-toolbar p-title="SGPP - Sistema de Gestão de Pedidos"> </po-toolbar>

<!-- Conteúdo principal envolvido na página PO-UI -->
<po-page-default [p-title]="'Bem-vindo, ' + (user?.name || 'Utilizador')">
  <div class="po-row">
    <!-- Card de informação (Widget) -->
    <div class="po-md-6 po-lg-4">
      <po-widget p-title="Painel de Controle">
        <p><strong>E-mail:</strong> {{ user?.email }}</p>
        <p><strong>Status:</strong> <span class="po-color-09">Autenticado via JWT</span></p>

        <div class="po-mt-2">
          <!-- Botão para encerrar a sessão -->
          <po-button p-label="Encerrar Sessão (Logout)" [p-danger]="true" (p-click)="onLogout()">
          </po-button>
        </div>
      </po-widget>
    </div>
  </div>
</po-page-default>

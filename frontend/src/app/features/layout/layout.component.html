<!-- Barra Superior com o perfil para o padrão do PO-UI -->
<po-toolbar
  p-title="SGPP - Sistema de Gestão de Pedidos"
  [p-profile]="{ title: user?.name || 'Utilizador', subtitle: user?.email }"
  [p-profile-actions]="profileActions"
>
</po-toolbar>

<!-- Menu Lateral (Sidebar) com as opções de Cadastros e Vendas -->
<po-menu [p-menus]="menus" p-logo="https://via.placeholder.com/70"> </po-menu>

<!--Container Principal de Conteúdo (Fora do po-menu para o router-outlet funcionar) -->
<div class="po-wrapper">
  <router-outlet></router-outlet>
</div>
